name: Update playlist

# Pulls the Apple Music playlist once a day and commits playlist.js when songs were
# added, removed or reordered. Can also be started by hand under Actions → Update playlist.
on:
  schedule:
    - cron: '23 4 * * *' # daily, 04:23 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-playlist
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild playlist.js from Apple Music
        run: python3 tools/update_playlist.py

      - name: Commit if the playlist changed
        run: |
          if git diff --quiet -- playlist.js; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist.js
          git commit -m "Update playlist from Apple Music"
          git push
